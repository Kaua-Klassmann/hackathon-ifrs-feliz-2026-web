version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Vars sem NEXT_PUBLIC_ não chegam ao runtime SSR do Amplify por padrão;
        # precisam ser gravadas no .env.production durante o build.
        # https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        - env | grep -e '^API_URL=' -e '^LOG_LEVEL=' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
