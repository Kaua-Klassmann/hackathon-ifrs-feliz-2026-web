services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
    image: hackathon-web
    container_name: hackathon-web
    env_file:
      - path: .env
        required: false
    ports:
      - "${WEB_PORT:-3000}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
